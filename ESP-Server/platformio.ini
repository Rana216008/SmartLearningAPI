[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv 

lib_deps =
    bodmer/TFT_eSPI@^2.5.31
    miguelbalboa/MFRC522@^1.4.11
    bodmer/TJpg_Decoder@^1.0.0  
    bblanchon/ArduinoJson@^7.0.4  
    DFRobot/DFRobotDFPlayerMini@^1.0.6  

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_MOSI=23
    -D TFT_MISO=-1
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=27
    -D TFT_RST=2
    -D TFT_BL=21
    -D SPI_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1